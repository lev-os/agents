errata:
  - id: dpa-us-subprocessor-annex
    template: assets/general-legal/templates/dpa-us/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    source_location: template.md:170
    issue: The processing details refer to a nonexistent Annex 5 for the Subprocessor List, while the operative clause and actual annex structure use Annex 4 or the Subprocessor Site.
    correction: Use Annex 4 or the selected Subprocessor Site consistently and record the correction as a source deviation.

  - id: privacy-gdpr-us-adequacy
    template: assets/general-legal/templates/privacy-policy-gdpr/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    source_location: template.md:409
    last_verified: 2026-08-23
    issue: The template categorically says the United States is not subject to an adequacy decision. EU and UK adequacy routes can apply to eligible, actively certified U.S. recipients under their respective Data Privacy Framework arrangements.
    correction: State the actual transfer mechanism. Use the EU-U.S. DPF only for an eligible recipient with active certification; analyze the UK Extension separately; otherwise identify the applicable safeguard or derogation.
    authorities:
      - https://eur-lex.europa.eu/eli/dec_impl/2023/1795/oj
      - https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/international-transfers/adequacy-regulations/how-does-the-uk-extension-to-the-eu-us-data-privacy-framework-work/

  - id: privacy-us-gdpr-scope-label
    template: assets/general-legal/templates/privacy-policy-us/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    source_location: template.md:1
    issue: The U.S.-only template labels itself GDPR-compliant based on the company having no EEA or UK establishment, but territorial scope can also arise from offering goods or services to or monitoring people there.
    correction: Remove the GDPR-compliant label. Use this template only after confirming the U.S.-only scope; otherwise route to privacy-policy-gdpr.
    authorities:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679

  - id: advisor-survival-range
    template: assets/general-legal/templates/advisor-agreement/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    source_location: template.md:5
    issue: The termination clause says Sections 2 through 9 survive, but the imported agreement ends at Section 7.
    correction: Change the survival range to Sections 2 through 7 unless additional numbered sections are deliberately added.

  - id: offer-letter-missing-exhibit-a
    template: assets/general-legal/templates/employee-offer-letter/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    source_location: template.md:22-49
    issue: The letter conditions employment and acceptance on Exhibit A, but the imported template contains only the exhibit heading and no agreement text.
    correction: Attach a separately reviewed Employee Confidential Information and Inventions Assignment Agreement or remove the Exhibit A condition and references.

  - id: msa-platform-fit
    template: assets/general-legal/templates/master-services-agreement/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    issue: The source is tailored to an on-premises generative-AI evaluation platform, not generic hosted SaaS.
    correction: Confirm deployment, platform IP, data, integration, acceptance, support, and order-form facts before retaining the source clauses.

  - id: terms-decisionlayer-option
    template: assets/general-legal/templates/terms-of-use/template.md
    observed_at_commit: f6772f0b754632f50ff2a24fa1150af41e1f76da
    source_location: template.md:59-70
    issue: Optional arbitration language selects DecisionLayer and permits AI-supervised arbitration.
    correction: Exclude Option B unless the user explicitly selects that provider after current rules, enforceability, disclosure, and counsel review are complete.
