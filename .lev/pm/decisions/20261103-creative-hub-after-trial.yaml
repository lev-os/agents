supersedes: 20261102-creative-design-hub (the unslop and stageshow rulings only; the hub, ux and cleanup rulings stand)

asked:
  - at: 2026-11-03
    answers: the five next steps after the 2026-11-02 package trial (1 AI-looking screens, 2 stageshow, 3 lev config wizard mode, 4 the .nvm folder, 5 the held ~/.agents files)
    words: |
      1a
      2 a, it should be 1 of the 2 variants so both should run
      3 a
      4 what the fuck, no it doesn't, or shouldn't............ check my mackbook via ssh. no wonder i had so much FUCKING trouble w/ qmd - recommend a better nvm if one exists now otherwise uninstall homebrew all node versions, preserve the cache if possible. but show me a tiny plan
