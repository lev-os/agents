reading:
  - '"2 a, it should be 1 of the 2 variants so both should run" read as: stageshow stays, with realistic content by default, and every mock product shot job makes two variants, one from stageshow and one from impeccable, shown side by side for the user to pick.'

rulings:
  ai_looking_screens:
    owner: skills/creative/SKILL.md route row
    rule: impeccable owns AI-looking screens. unslop stays a package that impeccable loads for its signs list (references/signs.md) and its story video. Impeccable itself stays the plain upstream install.
    options_considered:
      a: impeccable owns them; unslop becomes a reference it loads (chosen)
      b: unslop stays the owner, strengthened, then a 3-run retest
      c: archive unslop
  mock_product_shots:
    owner: skills/creative/SKILL.md route row
    rule: every mock product shot job makes two variants, one from stageshow and one from impeccable, shown side by side; the user picks. stageshow defaults to realistic content (a local change to the imported package).
    options_considered:
      a: keep stageshow with realistic content by default and a longer budget, retest with 3 runs (chosen, with the two-variant rule)
      b: send mock product shots to impeccable; stageshow only by name
      c: archive stageshow

evidence:
  package_trial: ~/.local/state/lev/skill-trials/20261102-creative-hub/results.html (Impeccable alone won 5 of 6 blind pairs in both orders; 1 tie)
