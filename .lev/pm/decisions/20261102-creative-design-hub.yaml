reading:
  - '"1b" read as creative is the hub. Option b of the hub question named ux as the hub, but JP''s answers 2 and 3 make creative the router and keep ux on its core, so the hub answer follows them. JP was told this reading in the same session and can reverse it.'
  - '"km" is a voice slip for "i''m".'

rulings:
  hub:
    owner: skills/creative/SKILL.md
    rule: creative routes every design job to one owner (ux, impeccable, unslop, taste-skill, stageshow, motion-graphics, remotion, archify, dataviz, now, pencil, slides, images, share images, package index) and names the tie-breaks where two owners meet.
    options_considered:
      a: creative is the hub (chosen)
      b: ux is the hub
      c: a new skill named design
  unslop:
    owner: skills-db/creative/unslop
    rule: unslop is its own creative package that creative routes to. Impeccable stays the plain upstream install, so Impeccable updates replace nothing.
    options_considered:
      a: keep unslop as a local patch inside Impeccable
      b: own package routed by creative (chosen)
      c: move into ux
  ux:
    owner: skills/ux/SKILL.md
    rule: ux owns research, personas, flows, wireframes, information architecture, the craft audit and CLI UX. When work turns to how the screen looks, moves or is shown, ux loads creative and passes its UX artifacts on, because UX and UI work usually come together.
    options_considered:
      a: move ux's hub parts into creative; ux keeps its core (chosen, with JP's load-creative rule)
      b: leave ux as a second hub
      c: merge ux into creative
  cleanup:
    rule: delete the nine empty skills-db/design-ux folders, archive the older Impeccable copy and the duplicate taste skill, fix ux's dead links.
    chosen: a
  stageshow:
    owner: skills-db/creative/stageshow
    rule: stageshow (benjitaylor/skills, MIT) is a creative package for mock product shots and cursor demos, after the skill-builder security scan.
  impeccable_helper_agents:
    rule: leave Impeccable's four helper agents uninstalled; Impeccable uses its built-in fallback.
    options_considered:
      a: install for the user account
      b: leave them out (chosen)
      c: install per project

