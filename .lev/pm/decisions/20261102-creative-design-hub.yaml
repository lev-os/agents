    2026-11-02, one Opus run per arm, two blind graders in opposite orders. Impeccable alone beat the
    hub-routed package in 5 of 6 items in both orders (three unslop pages, the stageshow video and bento);
    the stageshow hero still was a tie; the packages won none. Evidence and the results page:
    ~/.local/state/lev/skill-trials/20261102-creative-hub/results.html (verdicts.json, blind-key.json,
    frozen-digests.txt). The routing of AI-looking UI and mock product shots is open for JP after this result.
